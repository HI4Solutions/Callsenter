name: Deploy to production

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

# Never two deploys of the same environment at once; a newer push waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Production is created at launch (docs/plan.md, section 9). Until the repository variable
    # PRODUCTION_ENABLED is set to "true", pushes to main deploy nothing.
    if: vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: eu-north-1
      # Optional, set as variables on the GitHub Environment.
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      API_DOMAIN_NAME: ${{ vars.API_DOMAIN_NAME }}
      API_CERTIFICATE_ARN: ${{ vars.API_CERTIFICATE_ARN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build Lambda artifact
        run: |
          npm run build -w apps/api
          (cd apps/api/dist && zip -qr ../lambda.zip .)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Deploy stacks, migrate and smoke test
        run: infra/deploy.sh production
