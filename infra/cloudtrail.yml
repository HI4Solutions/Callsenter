AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  VeriQall audit log, layer 1 (docs/plan.md, section 3): a CloudTrail trail for every region of
  the account, delivered to its own KMS-encrypted bucket with log file validation. Deployed once
  per AWS account by an administrator, as veriqall-cloudtrail. The stack name is outside
  veriqall-<env>-*, so the GitHub deploy role cannot change it, and neither the deploy chain
  (roles under /veriqall/) nor anyone without the administrator's rights can stop the trail,
  delete the logs or disable the key.

Parameters:
  TrailName:
    Type: String
    Default: veriqall
  RetentionDays:
    Type: Number
    Default: 365
    MinValue: 90
    Description: Days each log file is locked (Object Lock, governance) and kept.

Resources:
  TrailKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: VeriQall CloudTrail logs
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministrators
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: CloudTrailEncrypts
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${TrailName}
              StringLike:
                kms:EncryptionContext:aws:cloudtrail:arn: !Sub arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:trail/*
          # The CloudFormation execution role of the deploy chain may create roles under
          # /veriqall/ with any policy. None of them may weaken the key that protects the logs.
          - Sid: DenyDeployChain
            Effect: Deny
            Principal: "*"
            Action:
              - kms:ScheduleKeyDeletion
              - kms:DisableKey
              - kms:DisableKeyRotation
              - kms:PutKeyPolicy
              - kms:CreateGrant
              - kms:Decrypt
            Resource: "*"
            Condition:
              ArnLike:
                aws:PrincipalArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/veriqall/*
      Tags:
        - Key: project
          Value: veriqall

  TrailKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/veriqall-cloudtrail
      TargetKeyId: !Ref TrailKey

  TrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: !Ref RetentionDays
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt TrailKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-after-retention
            Status: Enabled
            ExpirationInDays: !Ref RetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: project
          Value: veriqall

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${TrailName}
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${TrailName}
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt TrailBucket.Arn
              - !Sub ${TrailBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
          # The deploy chain may neither read, remove nor loosen the logs.
          - Sid: DenyDeployChain
            Effect: Deny
            Principal: "*"
            Action:
              - s3:GetObject
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:BypassGovernanceRetention
              - s3:PutObjectRetention
              - s3:PutObjectLegalHold
              - s3:PutBucketObjectLockConfiguration
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:PutLifecycleConfiguration
              - s3:PutBucketVersioning
              - s3:PutEncryptionConfiguration
              - s3:DeleteBucket
            Resource:
              - !GetAtt TrailBucket.Arn
              - !Sub ${TrailBucket.Arn}/*
            Condition:
              ArnLike:
                aws:PrincipalArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/veriqall/*

  # Management events (who changed what in the account, in every region), not data events:
  # the first copy of management events is free. Log file validation writes a signed digest
  # every hour, so a changed or deleted log file is detected (aws cloudtrail validate-logs).
  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: !Ref TrailName
      S3BucketName: !Ref TrailBucket
      KMSKeyId: !GetAtt TrailKey.Arn
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      Tags:
        - Key: project
          Value: veriqall

Outputs:
  TrailBucketName:
    Value: !Ref TrailBucket
  TrailArn:
    Value: !GetAtt Trail.Arn
