AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  VeriQall data: customer managed KMS key, PostgreSQL on RDS (TLS only, pgAudit, IAM
  authentication, point-in-time recovery), the audio bucket, and the application secret.
  See docs/plan.md, sections 3 and 9.

Parameters:
  Environment:
    Type: String
    AllowedValues: [staging, production]
  MultiAz:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
  InstanceClass:
    Type: String
    Default: db.t4g.micro
  AllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
  BackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 7
    MaxValue: 35
  AppOrigin:
    Type: String
    Default: ""
    Description: Origin of the web app; the only origin allowed to upload and play audio (bucket CORS).
  LogRetentionDays:
    Type: Number
    Default: 365
    Description: How long the database's log (pgAudit and connections) is kept in CloudWatch.
  DbConnectionsAlarmThreshold:
    Type: Number
    Default: 60
    Description: >-
      Connections that raise an alarm. db.t4g.micro allows about 80; raise this with the
      instance class.

Conditions:
  HasAppOrigin: !Not [!Equals [!Ref AppOrigin, ""]]

Resources:
  # One key per environment for RDS, the master secret, the app secret, the audio bucket and
  # the Lambda log groups.
  Key:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub VeriQall ${Environment}
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          # The Lambda and API log groups (veriqall-<env>-*), and the database's own log.
          - Sid: CloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/*/veriqall-${Environment}-*
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/rds/instance/veriqall-${Environment}/*
      Tags:
        - Key: project
          Value: veriqall
        - Key: environment
          Value: !Ref Environment

  KeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/veriqall-${Environment}
      TargetKeyId: !Ref Key

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub VeriQall ${Environment} private subnets
      SubnetIds: !Split [",", !ImportValue {"Fn::Sub": "veriqall-${Environment}-private-subnets"}]

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: VeriQall database, reachable only from the Lambda functions
      VpcId: !ImportValue {"Fn::Sub": "veriqall-${Environment}-vpc"}
      SecurityGroupIngress:
        - Description: Postgres from Lambda
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !ImportValue {"Fn::Sub": "veriqall-${Environment}-lambda-sg"}
      Tags:
        - Key: Name
          Value: !Sub veriqall-${Environment}-db

  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: !Sub VeriQall ${Environment}
      Family: postgres17
      Parameters:
        rds.force_ssl: "1"
        shared_preload_libraries: pgaudit,pg_stat_statements
        # Schema changes, role and permission changes, and writes. Statement parameters
        # (the data itself) are not logged.
        pgaudit.log: ddl,role,write
        pgaudit.log_parameter: "0"
        log_connections: "1"
        log_disconnections: "1"

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub veriqall-${Environment}
      Engine: postgres
      # Default minor version in eu-north-1 when written; minor upgrades are applied automatically.
      EngineVersion: "17.9"
      AutoMinorVersionUpgrade: true
      DBInstanceClass: !Ref InstanceClass
      AllocatedStorage: !Ref AllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: !Ref Key
      DBName: veriqall
      # The master user owns the schema and runs migrations. AWS creates and rotates its
      # password in Secrets Manager; it never appears in a template or a workflow.
      MasterUsername: veriqall_owner
      ManageMasterUserPassword: true
      MasterUserSecret:
        KmsKeyId: !Ref Key
      EnableIAMDatabaseAuthentication: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      PubliclyAccessible: false
      DBParameterGroupName: !Ref DbParameterGroup
      MultiAZ: !Ref MultiAz
      # Automated backups give point-in-time recovery within the retention period.
      BackupRetentionPeriod: !Ref BackupRetentionDays
      PreferredBackupWindow: "01:00-01:30"
      PreferredMaintenanceWindow: "sun:02:00-sun:03:00"
      CopyTagsToSnapshot: true
      DeletionProtection: true
      EnableCloudwatchLogsExports:
        - postgresql
      Tags:
        - Key: project
          Value: veriqall
        - Key: environment
          Value: !Ref Environment

  # --- The database's log ---------------------------------------------------------------------
  # RDS creates /aws/rds/instance/veriqall-<env>/postgresql itself when it first exports its log,
  # without a retention or the environment's key, so CloudFormation cannot own the group. This
  # small function gives it both, whether the group exists yet or not, and leaves it in place
  # when the stack is deleted.

  DbLogSettingsRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /veriqall/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: db-log-settings
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:PutRetentionPolicy
                  - logs:AssociateKmsKey
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/rds/instance/veriqall-${Environment}/postgresql
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/rds/instance/veriqall-${Environment}/postgresql:*
              # AssociateKmsKey requires the caller to be able to describe the key.
              - Effect: Allow
                Action: kms:DescribeKey
                Resource: !GetAtt Key.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/veriqall-${Environment}-db-log-settings:*

  DbLogSettingsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/veriqall-${Environment}-db-log-settings
      RetentionInDays: 30
      KmsKeyId: !GetAtt Key.Arn

  DbLogSettingsFunction:
    Type: AWS::Lambda::Function
    DependsOn: DbLogSettingsLogGroup
    Properties:
      FunctionName: !Sub veriqall-${Environment}-db-log-settings
      Description: Sets retention and the environment's key on the database's CloudWatch log
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt DbLogSettingsRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import time

          import boto3
          import botocore.exceptions
          import cfnresponse

          logs = boto3.client("logs")

          def associate_key(name, key):
              # A key policy or role policy changed in the same deploy can take a little while
              # to apply.
              for attempt in range(6):
                  try:
                      return logs.associate_kms_key(logGroupName=name, kmsKeyId=key)
                  except botocore.exceptions.ClientError as error:
                      code = error.response["Error"]["Code"]
                      if attempt == 5 or code not in ("InvalidParameterException", "AccessDeniedException"):
                          raise
                      time.sleep(5)

          def handler(event, context):
              props = event["ResourceProperties"]
              name = props["LogGroupName"]
              status, reason = cfnresponse.SUCCESS, None
              try:
                  if event["RequestType"] in ("Create", "Update"):
                      try:
                          logs.create_log_group(logGroupName=name)
                      except logs.exceptions.ResourceAlreadyExistsException:
                          pass
                      logs.put_retention_policy(logGroupName=name, retentionInDays=int(props["RetentionInDays"]))
                      associate_key(name, props["KmsKeyArn"])
              except Exception as error:
                  print(error)
                  status, reason = cfnresponse.FAILED, str(error)[:200]
              cfnresponse.send(event, context, status, {}, physicalResourceId=name, reason=reason)

  DbLogSettings:
    Type: Custom::DbLogSettings
    Properties:
      ServiceToken: !GetAtt DbLogSettingsFunction.Arn
      LogGroupName: !Sub /aws/rds/instance/veriqall-${Environment}/postgresql
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyArn: !GetAtt Key.Arn

  # --- Alarms ---------------------------------------------------------------------------------
  # To the environment's alert topic (infra/network.yml).

  DbCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub veriqall-${Environment}-db-cpu
      AlarmDescription: !Sub The veriqall-${Environment} database has used more than 80 % CPU for 15 minutes.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions: [!ImportValue {"Fn::Sub": "veriqall-${Environment}-alert-topic"}]
      OKActions: [!ImportValue {"Fn::Sub": "veriqall-${Environment}-alert-topic"}]

  DbStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub veriqall-${Environment}-db-storage
      AlarmDescription: !Sub The veriqall-${Environment} database has less than 2 GB free storage.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: missing
      AlarmActions: [!ImportValue {"Fn::Sub": "veriqall-${Environment}-alert-topic"}]
      OKActions: [!ImportValue {"Fn::Sub": "veriqall-${Environment}-alert-topic"}]

  DbConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub veriqall-${Environment}-db-connections
      AlarmDescription: !Sub The veriqall-${Environment} database is close to its connection limit.
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref DbConnectionsAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions: [!ImportValue {"Fn::Sub": "veriqall-${Environment}-alert-topic"}]
      OKActions: [!ImportValue {"Fn::Sub": "veriqall-${Environment}-alert-topic"}]

  # Values for Vipps, Idura and Soniox, filled in by hand in the console. CloudFormation only
  # writes the empty template at creation and never overwrites what is put there later.
  AppSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub callsenter/${Environment}/app
      Description: !Sub VeriQall ${Environment} provider credentials (JSON)
      KmsKeyId: !Ref Key
      SecretString: >-
        {"VIPPS_CLIENT_ID":"","VIPPS_CLIENT_SECRET":"","VIPPS_SUBSCRIPTION_KEY":"","VIPPS_MSN":"",
        "IDURA_CLIENT_ID":"","IDURA_CLIENT_SECRET":"","SONIOX_API_KEY":""}

  AudioBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt Key.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      # The browser uploads chunks and plays recordings through presigned URLs.
      CorsConfiguration: !If
        - HasAppOrigin
        - CorsRules:
            - AllowedOrigins: [!Ref AppOrigin]
              AllowedMethods: [PUT, GET, HEAD]
              AllowedHeaders: [content-type]
              ExposedHeaders: [ETag]
              MaxAge: 600
        - !Ref AWS::NoValue
      # Calls are deleted by the worker when their retention (at most 12 months) ends; these rules
      # make sure nothing outlives it: deleted versions go after a day, and any object after
      # 13 months.
      LifecycleConfiguration:
        Rules:
          - Id: retention-backstop
            Status: Enabled
            ExpirationInDays: 400
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
      Tags:
        - Key: project
          Value: veriqall
        - Key: environment
          Value: !Ref Environment

  AudioBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AudioBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AudioBucket.Arn
              - !Sub ${AudioBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
          # Uploads without encryption headers (the browser's presigned PUTs, the worker) get the
          # bucket's default: SSE-KMS with the environment's key. Only a request that asks for
          # something else is refused. (With StringNotEqualsIfExists a missing header counted as
          # "something else", so every upload was denied.)
          - Sid: DenyOtherEncryption
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub ${AudioBucket.Arn}/*
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
              "Null":
                s3:x-amz-server-side-encryption: "false"
          - Sid: DenyOtherKeys
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub ${AudioBucket.Arn}/*
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt Key.Arn
              "Null":
                s3:x-amz-server-side-encryption-aws-kms-key-id: "false"

Outputs:
  KeyArn:
    Value: !GetAtt Key.Arn
    Export:
      Name: !Sub veriqall-${Environment}-key
  DbEndpoint:
    Value: !GetAtt Database.Endpoint.Address
    Export:
      Name: !Sub veriqall-${Environment}-db-endpoint
  DbPort:
    Value: !GetAtt Database.Endpoint.Port
    Export:
      Name: !Sub veriqall-${Environment}-db-port
  DbResourceId:
    Value: !GetAtt Database.DbiResourceId
    Export:
      Name: !Sub veriqall-${Environment}-db-resource-id
  DbMasterSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
    Export:
      Name: !Sub veriqall-${Environment}-db-master-secret
  AppSecretArn:
    Value: !Ref AppSecret
    Export:
      Name: !Sub veriqall-${Environment}-app-secret
  AudioBucketName:
    Value: !Ref AudioBucket
    Export:
      Name: !Sub veriqall-${Environment}-audio-bucket
