AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  VeriQall bootstrap, deployed once per environment by an administrator. Gives the GitHub
  Actions deploy role just enough to deploy the veriqall-<env>-* stacks through a dedicated
  CloudFormation execution role, and creates the bucket that holds Lambda artifacts.

Parameters:
  Environment:
    Type: String
    AllowedValues: [staging, production]
  DeployRoleName:
    Type: String
    Description: Name (not ARN) of the existing IAM role GitHub Actions assumes through OIDC.

Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: project
          Value: veriqall
        - Key: environment
          Value: !Ref Environment

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub ${ArtifactsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # The role CloudFormation itself uses to create resources. The deploy role can only hand it
  # to CloudFormation; it cannot use these permissions directly. IAM is limited to roles under
  # the /veriqall/ path, so a template cannot create an administrator.
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /veriqall/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: provision
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Services
                Effect: Allow
                Action:
                  - acm:*
                  - amplify:*
                  - apigateway:*
                  - autoscaling:*
                  - cloudwatch:*
                  - ec2:*
                  - events:*
                  - kms:*
                  - lambda:*
                  - logs:*
                  - rds:*
                  - s3:*
                  - secretsmanager:*
                  - ses:*
                  - sns:*
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: RolesUnderVeriqallPath
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRole
                  - iam:AddRoleToInstanceProfile
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/veriqall/*
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/veriqall/*
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringLike:
                    iam:AWSServiceName:
                      - rds.amazonaws.com
                      - autoscaling.amazonaws.com
                      - ops.apigateway.amazonaws.com
      Tags:
        - Key: project
          Value: veriqall
        - Key: environment
          Value: !Ref Environment

  # Added to the existing GitHub Actions role for this environment.
  DeployRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: veriqall-deploy
      Roles:
        - !Ref DeployRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Stacks
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:CreateStack
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStacks
              - cloudformation:ExecuteChangeSet
              - cloudformation:GetTemplate
              - cloudformation:GetTemplateSummary
              - cloudformation:UpdateStack
            Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/veriqall-${Environment}-*/*
          - Sid: ValidateTemplates
            Effect: Allow
            Action:
              - cloudformation:ValidateTemplate
              - cloudformation:GetTemplateSummary
            Resource: "*"
          - Sid: PassExecutionRoleToCloudFormation
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt CloudFormationExecutionRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: cloudformation.amazonaws.com
          - Sid: Artifacts
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource: !Sub ${ArtifactsBucket.Arn}/*
          - Sid: RunMigrations
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:veriqall-${Environment}-migrator

Outputs:
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
  CloudFormationExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
